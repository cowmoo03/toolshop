name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build plugin
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ToolShop
          path: build/libs/ToolShop.jar

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/libs/ToolShop.jar \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA}" \
            --target "${GITHUB_SHA}"
