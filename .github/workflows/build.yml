name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build plugin
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v5
        with:
          name: plugins
          path: |
            build/libs/ToolShop.jar
            orewatch/build/libs/OreWatch.jar

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/libs/ToolShop.jar \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA}" \
            --target "${GITHUB_SHA}"

      - name: Publish OreWatch as the "orewatch-latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete orewatch-latest --yes --cleanup-tag || true
          gh release create orewatch-latest orewatch/build/libs/OreWatch.jar \
            --title "OreWatch latest build" \
            --notes "Built from ${GITHUB_SHA}" \
            --target "${GITHUB_SHA}" \
            --latest=false
