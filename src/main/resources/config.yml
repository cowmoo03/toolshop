# ToolShop 2.0: legendary tools
# Apply changes in-game with: /toolshop reload
#
# Each player can turn one iron, diamond or netherite pickaxe, axe, shovel and sword into a legendary tool,
# then upgrade it in /toolshop. Upgrades are permanent, but the tool can be lost like any item
# (it breaks, burns, or despawns), unless it has the matching safety upgrade.

# Sounds and particles when abilities go off.
effects: true

# Players must hold Shift (sneak) for Drill, Vein Mining, Timber and Excavator.
require-sneak: true

# Warn the holder (action bar) when a legendary tool drops to this % durability or less.
low-durability-warning-percent: 10

mcmmo:
  # Upgrades need an mcMMO skill level (Mining for pickaxes, Woodcutting for axes,
  # Excavation for shovels). If mcMMO isn't installed, level requirements are skipped.
  require-levels: true
  # Levels below are on mcMMO's Standard 0-100 scale. "auto" multiplies them by 10 when mcMMO uses Retro Mode
  # (0-1000), so Mining 30 here means Mining 300 in Retro Mode. Or set a number to multiply by.
  level-scale: auto
  # Multiplies the level needed for the upgrades every tool can get (Magnet, Durability Saver, Last Stand,
  # Fireproof, Recovery, Soulbound) on one skill's tools, after level-scale, rounded to the nearest 10.
  # A tool's own ability (Drill, Vein Mining, Timber, Excavator) isn't affected: set it under upgrades below.
  # Woodcutting is 1.25 because Timber logs give XP, so axes level faster.
  skill-multiplier:
    mining: 1.0
    woodcutting: 1.25
    excavation: 1.0
    swords: 1.0
    herbalism: 1.0
    tridents: 1.0
    crossbows: 1.0
    acrobatics: 1.0
    archery: 1.0
  # Only the block the player actually hits gives mcMMO XP, not the extra blocks an ability breaks.
  # Without this, a 5x5 Drill swing would give 25 blocks' worth of XP.
  xp-only-for-hit-block: true
  # mcMMO stops every block a piston moves from giving XP, so placing a block and pushing it can't farm XP.
  # That also catches tree farms that push grown logs. With this on, a log that grew from a sapling still gives
  # Woodcutting XP after a piston moves it. Logs a player placed still give none, pushed or not.
  pushed-logs-give-xp: true
  # Switch off mcMMO's Tree Feller: the Legendary Axe's Timber upgrade does the same job. /skills hides Tree Feller
  # (and Knock On Wood, which only works with it) while this is on. Takes effect on /toolshop reload.
  disable-tree-feller: true

# Cost of turning a tool into a legendary tool. Leave empty ({}) for free.
create-cost: {}

# Requirements for each tier: the mcMMO level needed and the items it costs.
# Items use Minecraft names, e.g. DIAMOND, IRON_INGOT, NETHERITE_INGOT, ENDER_PEARL.
upgrades:
  drill:
    - { level: 10, cost: { IRON_INGOT: 16 } }
    - { level: 30, cost: { DIAMOND: 8 } }
    - { level: 60, cost: { NETHERITE_INGOT: 2 } }
  vein:
    - { level: 15, cost: { IRON_INGOT: 16 } }
    - { level: 35, cost: { DIAMOND: 8 } }
    - { level: 65, cost: { NETHERITE_INGOT: 2 } }
  timber:
    - { level: 5, cost: { IRON_INGOT: 8 } }
    - { level: 30, cost: { DIAMOND: 8 } }
    - { level: 60, cost: { NETHERITE_INGOT: 2 } }
  excavator:
    - { level: 10, cost: { IRON_INGOT: 16 } }
    - { level: 30, cost: { DIAMOND: 8 } }
    - { level: 60, cost: { NETHERITE_INGOT: 2 } }
  magnet:
    - { level: 25, cost: { DIAMOND: 4, ENDER_PEARL: 4 } }
  durability:
    - { level: 20, cost: { IRON_INGOT: 16 } }
    - { level: 40, cost: { DIAMOND: 8 } }
    - { level: 70, cost: { NETHERITE_INGOT: 1 } }
  last-stand:
    - { level: 30, cost: { DIAMOND: 8 } }
  fireproof:
    - { level: 40, cost: { NETHERITE_SCRAP: 2 } }
    - { level: 60, cost: { NETHERITE_SCRAP: 4 } }
    - { level: 80, cost: { NETHERITE_INGOT: 1 } }
  # Netherite tools only (they can't burn, so they get Recovery instead of Fireproof).
  recovery:
    - { level: 40, cost: { NETHERITE_SCRAP: 2 } }
    - { level: 60, cost: { NETHERITE_SCRAP: 4 } }
    - { level: 80, cost: { NETHERITE_INGOT: 1 } }
  # Sword only. Levels are Swords levels.
  lifesteal:
    - { level: 15, cost: { GHAST_TEAR: 2 } }
    - { level: 35, cost: { GHAST_TEAR: 4, DIAMOND: 4 } }
    - { level: 65, cost: { NETHERITE_INGOT: 2 } }
  beheading:
    - { level: 20, cost: { BONE: 32 } }
    - { level: 40, cost: { DIAMOND: 8 } }
    - { level: 70, cost: { NETHERITE_INGOT: 1 } }
  bounty:
    - { level: 10, cost: { LAPIS_LAZULI: 32 } }
    - { level: 30, cost: { EMERALD: 16 } }
    - { level: 60, cost: { NETHERITE_INGOT: 1 } }
  # Hoe only. Levels are Herbalism levels.
  harvest:
    - { level: 10, cost: { IRON_INGOT: 16 } }
    - { level: 30, cost: { DIAMOND: 8 } }
    - { level: 60, cost: { NETHERITE_INGOT: 2 } }
  growth-aura:
    - { level: 20, cost: { BONE_MEAL: 64 } }
    - { level: 40, cost: { DIAMOND: 8 } }
    - { level: 70, cost: { NETHERITE_INGOT: 2 } }
  tiller:
    - { level: 5, cost: { IRON_INGOT: 8 } }
    - { level: 25, cost: { DIAMOND: 4 } }
    - { level: 50, cost: { NETHERITE_INGOT: 1 } }
  # Trident only. Levels are Tridents levels.
  tidal-pull:
    - { level: 15, cost: { PRISMARINE_SHARD: 16 } }
    - { level: 35, cost: { DIAMOND: 8 } }
    - { level: 65, cost: { NETHERITE_INGOT: 2 } }
  storm-caller:
    - { level: 25, cost: { COPPER_INGOT: 32 } }
    - { level: 45, cost: { DIAMOND: 8 } }
    - { level: 75, cost: { NETHERITE_INGOT: 2 } }
  # Crossbow only. Levels are Crossbows levels.
  arrow-saver:
    - { level: 10, cost: { ARROW: 64 } }
    - { level: 30, cost: { DIAMOND: 4 } }
    - { level: 60, cost: { NETHERITE_INGOT: 1 } }
  volley:
    - { level: 20, cost: { IRON_INGOT: 16 } }
    - { level: 40, cost: { DIAMOND: 8 } }
    - { level: 70, cost: { NETHERITE_INGOT: 2 } }
  blast-bolts:
    - { level: 15, cost: { TNT: 8 } }
    - { level: 35, cost: { DIAMOND: 8 } }
    - { level: 65, cost: { NETHERITE_INGOT: 2 } }
  # Bow only. Levels are Archery levels.
  seeker:
    - { level: 20, cost: { ENDER_EYE: 8 } }
    - { level: 40, cost: { DIAMOND: 8 } }
    - { level: 70, cost: { NETHERITE_INGOT: 2 } }
  quick-draw:
    - { level: 10, cost: { STRING: 32 } }
    - { level: 30, cost: { DIAMOND: 4 } }
    - { level: 60, cost: { NETHERITE_INGOT: 1 } }
  frost-arrows:
    - { level: 15, cost: { SNOWBALL: 32 } }
    - { level: 35, cost: { BLUE_ICE: 8 } }
    - { level: 65, cost: { NETHERITE_INGOT: 1 } }
  # Elytra only. Levels are Acrobatics levels.
  boost:
    - { level: 10, cost: { FIREWORK_ROCKET: 32 } }
    - { level: 30, cost: { DIAMOND: 8 } }
    - { level: 60, cost: { NETHERITE_INGOT: 2 } }
  rocket-saver:
    - { level: 15, cost: { GUNPOWDER: 32 } }
    - { level: 35, cost: { DIAMOND: 8 } }
    - { level: 65, cost: { NETHERITE_INGOT: 1 } }
  crash-guard:
    - { level: 20, cost: { HAY_BLOCK: 16, DIAMOND: 2 } }
  soulbound:
    - { level: 50, cost: { TOTEM_OF_UNDYING: 1 } }
    - { level: 70, cost: { TOTEM_OF_UNDYING: 2 } }
    - { level: 90, cost: { TOTEM_OF_UNDYING: 3 } }

drill:
  # Tier 1 = 1x2 (player height), tier 2 = 3x3, tier 3 = 5x5.
  # Hardest block the Drill will break. Stone 1.5, deepslate 3, deepslate ores 4.5, obsidian 50.
  max-hardness: 5.0
  # Never broken by the Drill. Containers and machines (chests, furnaces, hoppers...) are always skipped.
  never-break:
    - ANCIENT_DEBRIS
    - OBSIDIAN
    - CRYING_OBSIDIAN
    - RESPAWN_ANCHOR
    - REINFORCED_DEEPSLATE
    - BUDDING_AMETHYST

vein:
  # Most ores per swing for tier 1, 2 and 3.
  max-blocks: [8, 16, 32]
  # Every ore Vein Mining breaks gives Mining XP and gets mcMMO's Double Drops chance, not just the one you hit
  # (overrides xp-only-for-hit-block). Ores players placed never give XP either way.
  xp-for-all-ores: true
  # Extra hunger per extra ore. 4.0 = one hunger point.
  exhaustion-per-block: 0.15
  # Ancient debris is never allowed here.
  ores:
    - COAL_ORE
    - DEEPSLATE_COAL_ORE
    - IRON_ORE
    - DEEPSLATE_IRON_ORE
    - COPPER_ORE
    - DEEPSLATE_COPPER_ORE
    - GOLD_ORE
    - DEEPSLATE_GOLD_ORE
    - REDSTONE_ORE
    - DEEPSLATE_REDSTONE_ORE
    - LAPIS_ORE
    - DEEPSLATE_LAPIS_ORE
    - DIAMOND_ORE
    - DEEPSLATE_DIAMOND_ORE
    - EMERALD_ORE
    - DEEPSLATE_EMERALD_ORE
    - NETHER_GOLD_ORE
    - NETHER_QUARTZ_ORE

timber:
  # Most logs per chop for tier 1, 2 and 3. Trees whose logs touch fall together.
  max-logs: [16, 64, 150]
  # From this tier, a Silk Touch axe also collects the tree's leaves as leaf blocks.
  silk-leaves-from-tier: 3
  # A tree only falls if at least this many natural leaves touch it (protects log builds).
  min-natural-leaves: 3
  # Every log Timber fells gives Woodcutting XP, not just the one you hit (overrides xp-only-for-hit-block).
  xp-for-all-logs: true

excavator:
  # Tier 1 = 1x2, tier 2 = 3x3, tier 3 = 5x5. Only shovel blocks (dirt, sand, gravel...).
  exhaustion-per-block: 0.05

durability:
  # Chance (%) for a block to use no durability, for tier 1, 2 and 3. Stacks with Unbreaking.
  chance: [5, 10, 20]

fireproof:
  # Seconds a dropped tool survives in lava or fire, for tier 1, 2 and 3 (1 min, 3 min, 5 min). Then it burns.
  # Counted in game time, so it pauses while nobody is near the item. It also won't despawn during this time.
  seconds: [60, 180, 300]

recovery:
  # Netherite tools only. When dropped, the tool glows through walls (only its owner sees the glow).
  # Extra seconds before it despawns, on top of the normal 5 minutes, for tier 1, 2 and 3.
  # Counted in game time.
  # Tier 2+: explosions and cactus can't destroy it.
  # Tier 3: if it falls into the void it goes back to the owner (inventory, ender chest, or when they next join).
  extra-seconds: [60, 180, 300]

soulbound:
  # Deaths the tool survives, for tier 1, 2 and 3. Each death uses one save; with none left it drops normally.
  saves: [3, 5, 8]
  # When players can refill their saves in /toolshop (costs the items of their current tier, no level needed):
  # "empty" = only once all saves are used up, "anytime" = whenever they're below the maximum.
  recharge: empty

# The /skills window: every mcMMO skill with level, XP and abilities explained in plain words.
skills-menu:
  enabled: true
  # /mcstats and the per-skill commands (/mining, /axes, ...) open the window instead of a wall of chat.
  replace-mcmmo-commands: true
  # Hide mcMMO's per-skill and info commands from players' tab completion (ops still see everything).
  tidy-command-list: true

# Chat message shown once to each player when they join after an update.
# To show a new message after a future update: change the lines AND change the id.
# Lines use MiniMessage formatting (https://docs.advntr.dev/minimessage/format.html).
# Flight Charm: a crafted item anyone can use (no mcMMO level needed). Right-click it for creative-style flight,
# e.g. for building. Each charm is used up. One flight at a time: a charm can't be used while already flying.
flight-charm:
  enabled: true
  minutes: 5
  # mcMMO power level (all skill levels added up) needed to craft a charm, on the Standard scale like the other
  # levels here: with Retro Mode it's multiplied by mcmmo.level-scale (100 means 1000). 0 = no lock.
  # Only crafting is locked: anyone can use a charm they're given. Until then the recipe is hidden from the recipe book.
  unlock-power-level: 100
  # Going farther than this many blocks sideways from where you took off pauses the flight: you drop (no fall
  # damage) and the clock stops until you're back in range. Height isn't limited.
  max-distance: 64
  # Hitting or being hit by a player ends the flight, and a new one can't start for this many seconds.
  pvp-cooldown-seconds: 10
  # Show the time left like a potion: a Slow Falling effect lasting exactly as long as the flight (icon top-right,
  # countdown in the inventory). It ends with the flight, so it changes nothing. A resource pack would be needed
  # for a custom "Flight" name.
  show-effect: true
  # Also show the countdown bar at the top of the screen.
  boss-bar: true
  # When a survival player joins with flight still switched on (e.g. after a server crash), switch it off and
  # forgive their fall. Turn off if another plugin gives survival players flight.
  reset-stray-flight-on-join: true
  # Shaped crafting recipe: up to 3 rows of up to 3 letters (all rows the same length, space = empty slot),
  # and the item each letter stands for.
  recipe:
    shape: ["FGF", "GDG", "FGF"]
    ingredients: { F: FEATHER, G: GOLD_INGOT, D: DIAMOND }
    amount: 1

# Spawner claims and upgrades. Spawners work like vanilla whether they're claimed or not.
# Right-click a spawner to open its menu: claim an unclaimed one, upgrade your own, or take over someone else's. Claimed spawners show up in /toolshop (Your Spawners) where the owner can upgrade them from
# anywhere, turn them on/off or unclaim them. Only the owner (or an op) can break a claimed spawner; explosions can't.
# Each tier makes it spawn faster (shorter delay); the vanilla limits stay (about 6 of its mobs nearby, a player
# within 16 blocks). power-level is the mcMMO power level needed, on the Standard scale (x10 in Retro Mode).
spawner-upgrades:
  enabled: true
  # Most spawners one player can claim (0 = no limit).
  max-claims: 3
  claim:
    power-level: 50
    cost: { DIAMOND: 8 }
  # Taking over someone else's claimed spawner. Nobody gets these items back.
  takeover:
    power-level: 50
    cost: { DIAMOND: 16 }
  # Only the owner can upgrade, so a spawner has to be claimed first. Tiers stay on the spawner if it changes hands.
  tiers:
    - { speed: 1.25, power-level: 50, cost: { IRON_INGOT: 16, BONE: 8 } }
    - { speed: 1.5, power-level: 100, cost: { DIAMOND: 8 } }
    - { speed: 2.0, power-level: 150, cost: { NETHERITE_INGOT: 2 } }

# Legendary items and mcMMO work together. While you use your legendary item (held; the elytra worn), every upgrade
# tier on it adds bonus XP in its skill and shortens that skill's super ability cooldown (Super Breaker, Giga Drill
# Breaker, Green Terra, Serrated Strikes, Skull Splitter). Shown on the item as a ⚡ line.
synergy:
  enabled: true
  xp-percent-per-tier: 2
  max-xp-percent: 30
  cooldown-percent-per-tier: 4
  max-cooldown-percent: 50

join-announcement:
  enabled: true
  id: "2.0"
  delay-seconds: 3
  lines:
    - ""
    - "<gold><bold>⚒ New update: mcMMO + Legendary Tools!</bold></gold>"
    - "<gray>Everything you do now levels up skills. See yours with <yellow><click:run_command:'/mcstats'><hover:show_text:'<gray>Show your skills'>/mcstats</hover></click></yellow>.</gray>"
    - "<gray>Make your own <gold>legendary</gold> pickaxe, axe and shovel and upgrade them for good with mcMMO levels + items: Drill, Vein Mining, Timber, Excavator and more.</gray>"
    - "<red>Careful: a legendary tool can be lost! Protect it with Last Stand, Fireproof and Soulbound.</red>"
    - "<green><click:run_command:'/toolshop'><hover:show_text:'<gray>Open the Tool Shop'><u>Click here</u> or type /toolshop</hover></click></green> <gray>while holding an iron, diamond or netherite tool.</gray>"
    - ""

# Cosmetic ranks shown on the tool, by blocks broken with it.
# Legendary swords, tridents and crossbows rank up by kills instead of blocks (the elytra by blocks flown).
sword-ranks:
  0: Rusty
  100: Seasoned
  1000: Veteran
  5000: Legendary

# Sword abilities (they work on their own, no sneaking). Per tier I, II, III.
lifesteal:
  # Heals this % of the damage you deal with the sword (melee hits).
  percent: [5, 10, 15]
beheading:
  # Chance per kill to drop the mob's head: zombie, skeleton, creeper, piglin, wither skeleton, or a player's head.
  chance: [3, 6, 10]
bounty:
  # Extra XP orbs from kills.
  extra-percent: [25, 50, 100]
# Against players, sword, trident and crossbow abilities (Lifesteal, Beheading, Bounty, Tidal Pull, Storm Caller,
# Volley, Blast Bolts) are multiplied by this (0.5 = half). 0 turns them off in PvP.
sword-pvp-multiplier: 0.5

# Hoe: Harvest breaks the grown crops in a 3x3 / 5x5 / 7x7 around the one you break (sneaking).
harvest:
  # Every crop Harvest breaks gives Herbalism XP (they all grew there). false = only the one you hit.
  xp-for-all-crops: true
# Hoe: Growth Aura. While you hold the hoe, each crop within this many blocks has this % chance per second to grow
# a stage (vanilla crops grow a stage about once a minute on average). Per tier I, II, III.
growth-aura:
  radius: [4, 6, 8]
  chance-per-second: [4, 6, 8]
# Trident abilities, per tier I, II, III.
tidal-pull:
  # How hard a thrown trident pulls what it hits toward you, in tenths of a block per tick. Bosses aren't pulled.
  strength: [6, 10, 14]
storm-caller:
  # At most one lightning strike per this many seconds.
  cooldown-seconds: [30, 20, 10]
  # Lightning damage to what the trident hit (halved on players by sword-pvp-multiplier), plus setting it on fire.
  damage: 5
# Crossbow abilities, per tier I, II, III.
arrow-saver:
  chance: [20, 35, 50]
volley:
  extra-arrows: [1, 2, 4]
blast-bolts:
  # Damage to every mob around where the arrow lands (not the one it hits). Blocks and dropped items are never hurt.
  damage: [2, 3, 5]
  radius: 2.5
# Bow abilities, per tier I, II, III.
seeker:
  # Arrows lock onto the nearest hostile mob ahead of them within this many blocks...
  radius: [6, 9, 12]
  # ...and turn this % of the way toward it every tick.
  turn-percent: [15, 25, 35]
quick-draw:
  # A shot you don't fully draw still flies at least this hard (100 = like a full draw, with the crit).
  min-power-percent: [70, 85, 100]
frost-arrows:
  # Slowness II for this long (multiplied by sword-pvp-multiplier on players).
  seconds: [2, 3, 4]
# Elytra abilities, per tier I, II, III.
boost:
  # Boosts per flight; they refill when you land.
  charges: [1, 2, 3]
  # How hard each boost pushes (1.0 is about one firework rocket).
  strength: 1.0
rocket-saver:
  chance: [25, 50, 75]

ranks:
  0: Rusty
  1000: Seasoned
  10000: Veteran
  50000: Legendary
