# ToolShop 2.0: legendary tools
# Apply changes in-game with: /toolshop reload
#
# Each player can turn one iron, diamond or netherite pickaxe, axe and shovel into a legendary tool,
# then upgrade it in /toolshop. Upgrades are permanent, but the tool can be lost like any item
# (it breaks, burns, or despawns), unless it has the matching safety upgrade.

# Sounds and particles when abilities go off.
effects: true

# Players must hold Shift (sneak) for Drill, Vein Mining, Timber and Excavator.
require-sneak: true

# Warn the holder (action bar) when a legendary tool drops to this % durability or less.
low-durability-warning-percent: 10

mcmmo:
  # Upgrades need an mcMMO skill level (Mining for pickaxes, Woodcutting for axes,
  # Excavation for shovels). If mcMMO isn't installed, level requirements are skipped.
  require-levels: true
  # Only the block the player actually hits gives mcMMO XP, not the extra blocks an ability breaks.
  # Without this, a 5x5 Drill swing would give 25 blocks' worth of XP.
  xp-only-for-hit-block: true

# Cost of turning a tool into a legendary tool. Leave empty ({}) for free.
create-cost: {}

# Requirements for each tier: the mcMMO level needed and the items it costs.
# Items use Minecraft names, e.g. DIAMOND, IRON_INGOT, NETHERITE_INGOT, ENDER_PEARL.
upgrades:
  drill:
    - { level: 10, cost: { IRON_INGOT: 16 } }
    - { level: 30, cost: { DIAMOND: 8 } }
    - { level: 60, cost: { NETHERITE_INGOT: 2 } }
  vein:
    - { level: 15, cost: { IRON_INGOT: 16 } }
    - { level: 35, cost: { DIAMOND: 8 } }
    - { level: 65, cost: { NETHERITE_INGOT: 2 } }
  timber:
    - { level: 10, cost: { IRON_INGOT: 16 } }
    - { level: 30, cost: { DIAMOND: 8 } }
    - { level: 60, cost: { NETHERITE_INGOT: 2 } }
  excavator:
    - { level: 10, cost: { IRON_INGOT: 16 } }
    - { level: 30, cost: { DIAMOND: 8 } }
    - { level: 60, cost: { NETHERITE_INGOT: 2 } }
  magnet:
    - { level: 25, cost: { DIAMOND: 4, ENDER_PEARL: 4 } }
  durability:
    - { level: 20, cost: { IRON_INGOT: 16 } }
    - { level: 40, cost: { DIAMOND: 8 } }
    - { level: 70, cost: { NETHERITE_INGOT: 1 } }
  last-stand:
    - { level: 30, cost: { DIAMOND: 8 } }
  fireproof:
    - { level: 40, cost: { NETHERITE_SCRAP: 2 } }
    - { level: 60, cost: { NETHERITE_SCRAP: 4 } }
    - { level: 80, cost: { NETHERITE_INGOT: 1 } }
  soulbound:
    - { level: 50, cost: { TOTEM_OF_UNDYING: 1 } }
    - { level: 70, cost: { TOTEM_OF_UNDYING: 2 } }
    - { level: 90, cost: { TOTEM_OF_UNDYING: 3 } }

drill:
  # Tier 1 = 1x2 (player height), tier 2 = 3x3, tier 3 = 5x5.
  # Hardest block the Drill will break. Stone 1.5, deepslate 3, deepslate ores 4.5, obsidian 50.
  max-hardness: 5.0
  # Never broken by the Drill. Containers and machines (chests, furnaces, hoppers...) are always skipped.
  never-break:
    - ANCIENT_DEBRIS
    - OBSIDIAN
    - CRYING_OBSIDIAN
    - RESPAWN_ANCHOR
    - REINFORCED_DEEPSLATE
    - BUDDING_AMETHYST

vein:
  # Most ores per swing for tier 1, 2 and 3.
  max-blocks: [8, 16, 32]
  # Extra hunger per extra ore. 4.0 = one hunger point.
  exhaustion-per-block: 0.15
  # Ancient debris is never allowed here.
  ores:
    - COAL_ORE
    - DEEPSLATE_COAL_ORE
    - IRON_ORE
    - DEEPSLATE_IRON_ORE
    - COPPER_ORE
    - DEEPSLATE_COPPER_ORE
    - GOLD_ORE
    - DEEPSLATE_GOLD_ORE
    - REDSTONE_ORE
    - DEEPSLATE_REDSTONE_ORE
    - LAPIS_ORE
    - DEEPSLATE_LAPIS_ORE
    - DIAMOND_ORE
    - DEEPSLATE_DIAMOND_ORE
    - EMERALD_ORE
    - DEEPSLATE_EMERALD_ORE
    - NETHER_GOLD_ORE
    - NETHER_QUARTZ_ORE

timber:
  # Most logs per chop for tier 1, 2 and 3. Trees whose logs touch fall together.
  max-logs: [16, 64, 150]
  # From this tier, a Silk Touch axe also collects the tree's leaves as leaf blocks.
  silk-leaves-from-tier: 3
  # A tree only falls if at least this many natural leaves touch it (protects log builds).
  min-natural-leaves: 3

excavator:
  # Tier 1 = 1x2, tier 2 = 3x3, tier 3 = 5x5. Only shovel blocks (dirt, sand, gravel...).
  exhaustion-per-block: 0.05

durability:
  # Chance (%) for a block to use no durability, for tier 1, 2 and 3. Stacks with Unbreaking.
  chance: [5, 10, 20]

fireproof:
  # Seconds a dropped tool survives in lava or fire, for tier 1, 2 and 3 (1 min, 3 min, 5 min). Then it burns.
  # Counted in game time, so it pauses while nobody is near the item. It also won't despawn during this time.
  seconds: [60, 180, 300]

soulbound:
  # Deaths the tool survives, for tier 1, 2 and 3. Each death uses one save; with none left it drops normally.
  saves: [3, 5, 8]
  # When players can refill their saves in /toolshop (costs the items of their current tier, no level needed):
  # "empty" = only once all saves are used up, "anytime" = whenever they're below the maximum.
  recharge: empty

# Chat message shown once to each player when they join after an update.
# To show a new message after a future update: change the lines AND change the id.
# Lines use MiniMessage formatting (https://docs.advntr.dev/minimessage/format.html).
join-announcement:
  enabled: true
  id: "2.0"
  delay-seconds: 3
  lines:
    - ""
    - "<gold><bold>⚒ New update: mcMMO + Legendary Tools!</bold></gold>"
    - "<gray>Everything you do now levels up skills. See yours with <yellow><click:run_command:'/mcstats'><hover:show_text:'<gray>Show your skills'>/mcstats</hover></click></yellow>.</gray>"
    - "<gray>Make your own <gold>legendary</gold> pickaxe, axe and shovel and upgrade them for good with mcMMO levels + items: Drill, Vein Mining, Timber, Excavator and more.</gray>"
    - "<red>Careful: a legendary tool can be lost! Protect it with Last Stand, Fireproof and Soulbound.</red>"
    - "<green><click:run_command:'/toolshop'><hover:show_text:'<gray>Open the Tool Shop'><u>Click here</u> or type /toolshop</hover></click></green> <gray>while holding an iron, diamond or netherite tool.</gray>"
    - ""

# Cosmetic ranks shown on the tool, by blocks broken with it.
ranks:
  0: Rusty
  1000: Seasoned
  10000: Veteran
  50000: Legendary
