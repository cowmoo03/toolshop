name: ToolShop
version: '${version}'
main: io.github.cowmoo03.toolshop.ToolShopPlugin
api-version: '26.2'
description: Legendary tools - one upgradeable pickaxe, axe, shovel and sword per player, unlocked with mcMMO levels and items.
authors:
  - cowmoo03
dependencies:
  server:
    mcMMO:
      load: BEFORE
      required: false
permissions:
  toolshop.use:
    description: Open /toolshop and use legendary tools
    default: true
  toolshop.admin:
    description: Give legendary tools, set upgrades and reload the config
    default: op
